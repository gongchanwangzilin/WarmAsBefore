name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v0.2)'
        required: true
        default: 'v0.2'

permissions:
  contents: write   # 建 release 需要

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android workload
      run: dotnet workload install maui-android --ignore-failed-sources

    - name: Restore dependencies
      run: dotnet restore WarmAsBefore.csproj

    # ---------- 签名密钥（v1.8 起 APK 自动签名）----------
    # 说明：密钥库本身只有 4.4KB，直接以明文放在 Signing/ 目录随 checkout 落地。
    # 密码在下方 CI 明文中（与 7z 包密码相同，见 Signing/README.md）。
    # 之前用 7z 加密包导致 ubuntu runner 解不开（7zz/7z 都装不上、py7zr 头加密也不认），
    # 改为直接读 checkout 下来的 .p12，去掉 7z 依赖。7z 加密包仍保留在 dist/ 供你手动下载备份。

    # ---------- 签名发布（用 checkout 下来的 Signing/ 明文 .p12）----------
    - name: Publish Android APK (ARM64, signed)
      run: |
        KS="Signing/warmasbefore-release.p12"
        test -f "$KS" || { echo "缺少签名密钥 $KS" >&2; exit 1; }
        dotnet publish WarmAsBefore.csproj -c Release -f net10.0-android -r android-arm64 \
          -p:AndroidPackageFormat=apk \
          -p:AndroidKeyStore=true \
          -p:AndroidKeyStorePassword='@2012N10y26r' \
          -p:AndroidSigningKeyStore="$KS" \
          -p:AndroidSigningKeyAlias=warmasbefore \
          -p:AndroidSigningKeyPassphrase='@2012N10y26r'

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Rename APK to standard name
      run: |
        # 输出路径按 csproj 里 AndroidMauiVersion 决定：SDK 41 => net10.0-android，
        # 旧 SDK(35) 只会出 net9.0-android。取实际存在的目录，避免硬编码猜版本
        candidates=()
        for d in bin/Release/net*/android-arm64/publish; do
          [ -d "$d" ] && candidates+=("$d")
        done
        if [ ${#candidates[@]} -eq 0 ]; then
          echo "错误：未找到 android-arm64/publish 目录" >&2
          find . -name "*.apk" -not -path "./obj/*" 2>/dev/null
          exit 1
        fi
        if [ ${#candidates[@]} -gt 1 ]; then
          echo "错误：有多个候选目录，请手动指定：$(printf '%s ' "${candidates[@]}")" >&2
          exit 1
        fi
        dir="${candidates[0]}"
        echo "使用输出目录: $dir"
        for f in "$dir"/*.apk; do
          [ -e "$f" ] || continue
          mv "$f" "WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk"
        done
        ls -la *.apk

    # ---------- 签名验证（用 aapt2 / apksigner 确认 APK 真被签名了）----------
    - name: Verify APK signature
      run: |
        apk=$(ls *.apk | head -1)
        echo "验证签名: $apk"
        # apksigner 在 setup-java 的 temurin 里不带，用 aapt2 dump badging 或 keytool 退而求其次：
        # 能 unzip 且含 META-INF/CERT 即说明签名过
        unzip -l "$apk" | grep -qiE "META-INF/.*\.(RSA|SF|DSA)" && echo "APK 含签名区（OK）" || {
          echo "警告：APK 未发现签名区（可能未签名成功）" >&2
          exit 1
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        files: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk
