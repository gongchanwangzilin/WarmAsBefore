name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v0.2)'
        required: true
        default: 'v0.2'

permissions:
  contents: write   # 建 release 需要

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Android workload
      run: dotnet workload install maui-android --ignore-failed-sources
      
    - name: Restore dependencies
      run: dotnet restore WarmAsBefore.csproj
      
    - name: Publish Android APK (ARM64)
      run: dotnet publish WarmAsBefore.csproj -c Release -f net10.0-android -r android-arm64 -p:AndroidPackageFormat=apk
      
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
        
    - name: Rename APK to standard name
      run: |
        dir=bin/Release/net10.0-android/android-arm64/publish
        for f in $dir/*.apk; do mv "$f" "WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk"; done

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        files: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk
