name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v0.2)'
        required: true
        default: 'v0.2'

permissions:
  contents: write   # 建 release 需要
  # 签名密钥走 GitHub Secrets（仓库设置 → Secrets and variables → Actions）：
  #   WARMASBEFORE_P12_B64    : p12 文件的 base64 内容（签名前解码还原）
  #   WARMASBEFORE_KEY_PASS   : p12 库密码 + 私钥密码（库密码=私钥密码）
  #   WARMASBEFORE_KEY_ALIAS  : 别名（warmasbefore）

jobs:
  build-android:
    runs-on: ubuntu-latest
    # job 级 env：secrets 只能在此处引用，后续各 step 用 env.XXX 引用
    # if: 表达式里 step 级 env 不可见，必须走 job 级
    env:
      P12_B64: ${{ secrets.WARMASBEFORE_P12_B64 }}
      KEY_PASS: ${{ secrets.WARMASBEFORE_KEY_PASS }}
      KEY_ALIAS: ${{ secrets.WARMASBEFORE_KEY_ALIAS }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android workload
      run: dotnet workload install maui-android --ignore-failed-sources

    - name: Restore dependencies
      run: dotnet restore WarmAsBefore.csproj

    # ---------- 云端打包（未签名 APK）----------
    # 流程约定：CI 只出未签名 APK 供装机测试；最终发布包由本地用 Signing/warmasbefore-release.p12
    # 签名（apksigner sign，密钥信息见 Signing/README.md）。
    # 密钥明文不进仓库，dist/warmasbefore-signing.7z 是加密备份（7z + 密码，见 Signing/README.md）。
    - name: Publish Android APK (ARM64, unsigned)
      run: dotnet publish WarmAsBefore.csproj -c Release -f net10.0-android -r android-arm64 -p:AndroidPackageFormat=apk

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Rename APK to standard name
      run: |
        # 输出路径按 csproj 里 AndroidMauiVersion 决定：SDK 41 => net10.0-android，
        # 旧 SDK(35) 只会出 net9.0-android。取实际存在的目录，避免硬编码猜版本
        candidates=()
        for d in bin/Release/net*/android-arm64/publish; do
          [ -d "$d" ] && candidates+=("$d")
        done
        if [ ${#candidates[@]} -eq 0 ]; then
          echo "错误：未找到 android-arm64/publish 目录" >&2
          find . -name "*.apk" -not -path "./obj/*" 2>/dev/null
          exit 1
        fi
        if [ ${#candidates[@]} -gt 1 ]; then
          echo "错误：有多个候选目录，请手动指定：$(printf '%s ' "${candidates[@]}")" >&2
          exit 1
        fi
        dir="${candidates[0]}"
        echo "使用输出目录: $dir"
        for f in "$dir"/*.apk; do
          [ -e "$f" ] || continue
          mv "$f" "WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk"
        done
        ls -la *.apk

    # ---------- 签名（密钥走 Secrets，不进仓库）----------
    # 3 个 secret（Settings → Secrets and variables → Actions）：
    #   WARMASBEFORE_P12_B64   = p12 文件的 base64
    #   WARMASBEFORE_KEY_PASS  = p12 库密码（=私钥密码）
    #   WARMASBEFORE_KEY_ALIAS = 别名
    - name: Sign APK with release keystore (from Secrets)
      id: sign
      run: |
        if [ -z "$P12_B64" ]; then
          echo "未配置 WARMASBEFORE_P12_B64 secret，跳过签名（出未签名 APK）"
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # 兼容 secret 值被拆成多行：先删掉所有换行再 base64 解码
        P12_ONE=$(echo "$P12_B64" | tr -d '\n')
        echo "$P12_ONE" | base64 -d > signing.p12
        chmod 600 signing.p12
        # 校验解码字节数（本地 p12 是 4436 字节）
        sz=$(stat -c%s signing.p12 2>/dev/null || stat -f%z signing.p12)
        echo "signing.p12 size=$sz"
        [ "$sz" -ne 4436 ] && { echo "p12 大小异常，中止签名" >&2; exit 1; }
        apk="WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk"
        # jarsigner V1 签名；密码里若有 $ 等特殊字符，在双引号内由 bash 按字面值传递（secret 本身是纯文本）
        jarsigner -keystore signing.p12 -storetype PKCS12 \
          -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
          -digestalg SHA256 "$apk" "$KEY_ALIAS"
        rm -f signing.p12
        mv "$apk" "WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64-signed.apk"
        echo "签名完成: $apk"
        echo "signed=true" >> "$GITHUB_OUTPUT"

    # 签名成功时只上传签名版；secret 未配置时回退上传未签名版
    - name: Create Release (signed)
      if: steps.sign.outputs.signed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        files: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64-signed.apk

    - name: Create Release (unsigned fallback)
      if: steps.sign.outputs.signed != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        files: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk
