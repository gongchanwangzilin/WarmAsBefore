name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v0.2)'
        required: true
        default: 'v0.2'

permissions:
  contents: write   # 建 release 需要

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android workload
      run: dotnet workload install maui-android --ignore-failed-sources

    - name: Restore dependencies
      run: dotnet restore WarmAsBefore.csproj

    # ---------- 准备签名密钥（7z 密码加密，v1.8 起 APK 自动签名）----------
    - name: Decrypt signing keystore (7z)
      run: |
        set -e
        # 1) 装 7zip（ubuntu runner 上装 7zz；失败则回退 7z）
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq 7zip || sudo apt-get install -y -qq p7zip-full || true
        # 2) 7z 包创建时用了 -mhe（头加密），解包需要 -p 密码。
        #    7zz/7z 都找不到就直接用 python3 + py7zr（最稳，不依赖 apt 源）
        if ! command -v 7zz >/dev/null 2>&1 && ! command -v 7z >/dev/null 2>&1; then
          echo "7zz/7z 缺失，改用 py7zr"
          python3 -m pip install -q py7zr
          python3 - <<'PY'
          import py7zr
          with py7zr.SevenZipFile("dist/warmasbefore-signing.7z", mode="r",
                                   password="@2012N10y26r") as a:
              a.extractall(".")
          print("py7zr 解压成功")
          PY
        elif command -v 7zz >/dev/null 2>&1; then
          7zz x -y -p'@2012N10y26r' dist/warmasbefore-signing.7z
        else
          7z x -y -p'@2012N10y26r' dist/warmasbefore-signing.7z
        fi
        test -f Signing/warmasbefore-release.p12 || test -f warmasbefore-release.p12
        echo "7z 解压 OK"

    # ---------- 签名发布 ----------
    - name: Publish Android APK (ARM64, signed)
      run: |
        if [ -f Signing/warmasbefore-release.p12 ]; then KS="Signing/warmasbefore-release.p12"; else KS="warmasbefore-release.p12"; fi
        dotnet publish WarmAsBefore.csproj -c Release -f net10.0-android -r android-arm64 \
          -p:AndroidPackageFormat=apk \
          -p:AndroidKeyStore=true \
          -p:AndroidKeyStorePassword='@2012N10y26r' \
          -p:AndroidSigningKeyStore="$KS" \
          -p:AndroidSigningKeyAlias=warmasbefore \
          -p:AndroidSigningKeyPassphrase='@2012N10y26r'

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Rename APK to standard name
      run: |
        # 输出路径按 csproj 里 AndroidMauiVersion 决定：SDK 41 => net10.0-android，
        # 旧 SDK(35) 只会出 net9.0-android。取实际存在的目录，避免硬编码猜版本
        candidates=()
        for d in bin/Release/net*/android-arm64/publish; do
          [ -d "$d" ] && candidates+=("$d")
        done
        if [ ${#candidates[@]} -eq 0 ]; then
          echo "错误：未找到 android-arm64/publish 目录" >&2
          find . -name "*.apk" -not -path "./obj/*" 2>/dev/null
          exit 1
        fi
        if [ ${#candidates[@]} -gt 1 ]; then
          echo "错误：有多个候选目录，请手动指定：$(printf '%s ' "${candidates[@]}")" >&2
          exit 1
        fi
        dir="${candidates[0]}"
        echo "使用输出目录: $dir"
        for f in "$dir"/*.apk; do
          [ -e "$f" ] || continue
          mv "$f" "WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk"
        done
        ls -la *.apk

    # ---------- 签名验证（用 aapt2 / apksigner 确认 APK 真被签名了）----------
    - name: Verify APK signature
      run: |
        apk=$(ls *.apk | head -1)
        echo "验证签名: $apk"
        # apksigner 在 setup-java 的 temurin 里不带，用 aapt2 dump badging 或 keytool 退而求其次：
        # 能 unzip 且含 META-INF/CERT 即说明签名过
        unzip -l "$apk" | grep -qiE "META-INF/.*\.(RSA|SF|DSA)" && echo "APK 含签名区（OK）" || {
          echo "警告：APK 未发现签名区（可能未签名成功）" >&2
          exit 1
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        files: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk
