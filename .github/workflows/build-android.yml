name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v0.2)'
        required: true
        default: 'v0.2'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Android workloads
      run: dotnet workload install android --ignore-failed-sources
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Publish Android APK (ARM64)
      run: dotnet publish WarmAsBefore.csproj -c Release -p:TargetFramework=net9.0-android -p:RuntimeIdentifier=android-arm64 -p:AndroidPackageFormat=apk
      
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: ${{ steps.version.outputs.version }}
        draft: true
        prerelease: false
        
    - name: Upload APK
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: bin/Release/net9.0-android/android-arm64/publish/*.apk
        asset_name: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk
        asset_content_type: application/vnd.android.package-archive