name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v0.2)'
        required: true
        default: 'v0.2'

permissions:
  contents: write   # 建 release 需要

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Android workload
      run: dotnet workload install maui-android --ignore-failed-sources
      
    - name: Restore dependencies
      run: dotnet restore WarmAsBefore.csproj
      
    - name: Publish Android APK (ARM64)
      run: dotnet publish WarmAsBefore.csproj -c Release -f net10.0-android -r android-arm64 -p:AndroidPackageFormat=apk
      
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
        
    - name: Rename APK to standard name
      run: |
        # 输出路径按 csproj 里 AndroidMauiVersion 决定：SDK 41 => net10.0-android，
        # 旧 SDK(35) 只会出 net9.0-android。取实际存在的目录，避免硬编码猜版本
        candidates=()
        for d in bin/Release/net*/android-arm64/publish; do
          [ -d "$d" ] && candidates+=("$d")
        done
        if [ ${#candidates[@]} -eq 0 ]; then
          echo "错误：未找到 android-arm64/publish 目录" >&2
          find . -name "*.apk" -not -path "./obj/*" 2>/dev/null
          exit 1
        fi
        if [ ${#candidates[@]} -gt 1 ]; then
          echo "错误：有多个候选目录，请手动指定：$(printf '%s ' "${candidates[@]}")" >&2
          exit 1
        fi
        dir="${candidates[0]}"
        echo "使用输出目录: $dir"
        for f in "$dir"/*.apk; do
          [ -e "$f" ] || continue
          mv "$f" "WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk"
        done
        ls -la *.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        files: WarmAsBefore-${{ steps.version.outputs.version }}-android-arm64.apk
