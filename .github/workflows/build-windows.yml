name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g., v1.25)'
        required: true
        default: 'v1.25'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Publish Windows x64
      run: dotnet publish WarmAsBefore.csproj -c Release -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64 --self-contained true
      
    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          Write-Output "version=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
        } else {
          Write-Output "version=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        }
        
    - name: Package zip (auto-updater requires a .zip named with win-x64)
      shell: pwsh
      run: |
        $v = "${{ steps.version.outputs.version }}"
        $dir = "bin/Release/net10.0-windows10.0.19041.0/win-x64/publish"
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        $zip = "dist/WarmAsBefore_${v}_win-x64.zip"
        Compress-Archive -Path "$dir/*" -DestinationPath $zip -CompressionLevel Optimal
        (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() | Out-File "$zip.sha256" -NoNewline -Encoding ascii
        "zip=$zip" >> $env:GITHUB_OUTPUT
        "sha=$zip.sha256" >> $env:GITHUB_OUTPUT
      id: pack

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: ${{ steps.version.outputs.version }}
        draft: false
        # 由 tag 推导：v1.4.0-beta 会自动标为预发布，v1.4.0 则是正式版
        prerelease: ${{ contains(github.ref_name, '-beta') }}
        
    - name: Upload zip
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.pack.outputs.zip }}
        asset_name: WarmAsBefore_${{ steps.version.outputs.version }}_win-x64.zip
        asset_content_type: application/zip

    - name: Upload sha256
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.pack.outputs.sha }}
        asset_name: WarmAsBefore_${{ steps.version.outputs.version }}_win-x64.zip.sha256
        asset_content_type: text/plain
